services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: permission_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d permission_center"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - permission-center-data:/var/lib/postgresql/data
volumes:
  permission-center-data:
