http:
  addr: ":8080"
logging:
  module: "permission-center-go"
  minimum_level: "info"
  # Set a path such as "logs/permission-center-go.log" to also write to a file.
  file_path: ""
database:
  url: "postgres://postgres:postgres@localhost:55433/permission_center?sslmode=disable"
  max_conns: 10
  min_conns: 2
service_resource:
  source: "nexusauth"
  nexusauth_base_url: "http://localhost:5100"
  # Configure a targetType=service_resource Open API credential through
  # PERMISSION_CENTER_SERVICE_RESOURCE_API_KEY in production.
  api_key: ""
  timeout: "5s"
pdp:
  # Required by the service-to-service /v1/pdp/decisions endpoint in production.
  service_credential: ""
oidc:
  enabled: false
  authority: "http://localhost:5100"
  backchannel_authority: ""
  client_id: "permission.center"
  client_secret: "replace-with-client-secret"
  redirect_uri: "http://localhost:8080/signin-oidc"
  post_logout_redirect_uri: "http://localhost:5274/"
  scopes: ["openid", "profile", "offline_access", "permission.center.api"]
  audience: "permission.center.api"
  session_secret: "replace-with-at-least-32-random-characters"
  cookie_secure: false
  cookie_name: "permission_center_session"
