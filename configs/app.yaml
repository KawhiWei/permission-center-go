http:
  addr: ":8080"
database:
  url: "postgres://postgres:postgres@localhost:55433/permission_center?sslmode=disable"
  max_conns: 10
  min_conns: 2
application_catalog:
  source: "local"
oidc:
  enabled: false
  authority: "http://localhost:5100"
  backchannel_authority: ""
  client_id: "permission.center"
  client_secret: "replace-with-client-secret"
  redirect_uri: "http://localhost:8080/signin-oidc"
  post_logout_redirect_uri: "http://localhost:5274/"
  scopes: ["openid", "profile", "offline_access", "permission.center.api"]
  audience: "permission.center.api"
  session_secret: "replace-with-at-least-32-random-characters"
  cookie_secure: false
  cookie_name: "permission_center_session"
